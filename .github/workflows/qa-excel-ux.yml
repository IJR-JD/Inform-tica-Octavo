name: QA · Excel editable UX (Chromium)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'unidad-00-diagnostico/**'
      - 'unidad-01-excel/**'
      - 'unidad-02-excel/**'
      - 'unidad-03-excel/**'
      - 'unidad-04-excel/**'
      - 'excel-modules-*.js'
      - 'excel-core.js'
      - 'tests/excel-core-qa.mjs'
      - 'excel-modules.css'
      - 'pedagogia-modulos.js'
      - 'tests/excel-ux-qa.mjs'
      - 'tests/excel-edge-qa.mjs'
      - 'tests/excel-modules-qa.mjs'
      - 'tests/diagnostic-qa.mjs'
      - 'index.html'
      - 'studio-shell.css'
      - 'motion-figures.*'
      - 'studio-exercise-figure.js'
      - 'tests/studio-media-qa.mjs'
      - 'excel-sandbox/**'
      - 'tests/studio-shell-qa.mjs'
      - '.github/workflows/qa-excel-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser:
    name: Diagnostic 00 + Excel modules 01–04 · browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tools
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Serve actual static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ti8-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/unidad-01-excel/ > /dev/null; then
              echo 'Static site ready'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ti8-server.log
          exit 1
      - name: Verify user behavior in headless Chromium
        run: |
          node tests/excel-core-qa.mjs
          node tests/excel-ux-qa.mjs
          node tests/excel-edge-qa.mjs
          node tests/excel-modules-qa.mjs
          node tests/diagnostic-qa.mjs
          node tests/studio-shell-qa.mjs
          node tests/studio-media-qa.mjs

      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ti8-studio-visual-review
          path: qa-visual/
          if-no-files-found: ignore
