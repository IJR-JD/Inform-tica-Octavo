name: Deploy Informatics Learning Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stamp deployed commit
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > release.json
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2 && npx playwright install chromium
      - name: Verify exact public release from fresh browser
        env:
          TI8_BASE: https://ijr-jd.github.io/Inform-tica-Octavo/
          TI8_RELEASE: ${{ github.sha }}
        run: node tests/open-learning-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-open-learning-screenshots
          path: qa-public/
          if-no-files-found: ignore
